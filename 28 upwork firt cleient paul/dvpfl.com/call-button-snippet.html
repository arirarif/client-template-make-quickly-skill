<!--
==========================================================================
  DVPFL — FLOATING CALL + EMAIL BUTTON
  v1.0  |  2026-08-30

  WHY THIS EXISTS
  Chaty was deactivated on 2026-08-29 as part of the speed work. It was
  carrying the site's only tap-to-call — measured on all 17 pages — so
  deactivating it left every page except /contact-us/ with no way to phone
  or email at all. On a wedding videography site, where couples ring you,
  that is a lead hole, not a cosmetic issue.

  It also happens to be Issue #7 from the August audit:
  "No tel: link and no email link on the homepage. Wedding leads call/text.
   The floating CALL US NOW!!! widget is the only tap-to-call."

  This replaces the widget without the plugin. Chaty shipped a render-
  blocking stylesheet plus a footer script; this is inline HTML, CSS and a
  single anchor — no extra request at all, and a real <a href="tel:"> that
  search engines and screen readers understand, which the old widget's
  javascript:void(0) markup did not.

  Numbers are the ones the old widget used and the contact page still
  shows: tel:+19418940980 and paul@dvpfl.com.

  DEPLOY
  Elementor -> Custom Code -> location <body> - End, condition Entire Site.
  Keep it separate from snippet 2596, which is front-page-only and holds
  the homepage poster work.
==========================================================================
-->

<style>
.dvp-contact{
  position: fixed;
  left: 1rem;
  bottom: 1rem;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: .6rem;
}

.dvp-contact__btn{
  display: flex;
  align-items: center;
  gap: .55rem;
  height: 3.25rem;
  padding: 0 1.1rem 0 .95rem;
  border-radius: 2rem;
  color: #fff;
  text-decoration: none;
  font: 600 .95rem/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  letter-spacing: .01em;
  white-space: nowrap;
  box-shadow: 0 3px 14px rgba(0,0,0,.28);
  transition: transform .18s ease, box-shadow .18s ease;
}
.dvp-contact__btn--call{ background: #25A55F; }
.dvp-contact__btn--mail{ background: #2A2F36; }

.dvp-contact__btn:hover,
.dvp-contact__btn:focus-visible{
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,.36);
  color: #fff;
}
.dvp-contact__btn:focus-visible{ outline: 3px solid #fff; outline-offset: 2px; }

.dvp-contact__btn svg{ flex: none; }

/* On phones the label is dropped and the buttons become circles - the
   thumb target stays 3.25rem, comfortably above the 44px minimum. */
@media (max-width: 600px){
  .dvp-contact__btn{
    width: 3.25rem;
    padding: 0;
    justify-content: center;
  }
  .dvp-contact__label{
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
}

/* Printing a fixed floating button wastes ink and covers content. */
@media print{ .dvp-contact{ display: none; } }

@media (prefers-reduced-motion: reduce){
  .dvp-contact__btn{ transition: none; }
}
</style>

<script>
/* ------------------------------------------------------------------
   Audit issue #10, second half: pinch-zoom is disabled sitewide.

   The Aurel theme prints, at offset ~125 of every page:
       <meta name="viewport"
             content="width=device-width, initial-scale=1, maximum-scale=1">

   `maximum-scale=1` stops a visitor pinching to zoom. That fails WCAG
   1.4.4 (Resize Text) and Lighthouse flags it under Accessibility as
   [user-scalable="no"] ... or [maximum-scale] is less than 5. On a site
   whose buyers are often the couple's parents, being unable to zoom is a
   real problem, not a checkbox.

   The theme gives no setting for it and there is no child theme, so we
   rewrite the tag. Browsers re-evaluate the viewport when this attribute
   changes, so doing it here still restores zoom.

   Only `maximum-scale` and `user-scalable` are touched; width and
   initial-scale are left exactly as the theme set them, so layout is
   unaffected.
   ------------------------------------------------------------------ */
(function () {
  var m = document.querySelector('meta[name="viewport"]');
  if (!m) return;
  var v = m.getAttribute('content') || '';
  if (!/maximum-scale|user-scalable/i.test(v)) return;   /* already fine */
  v = v.replace(/\s*,?\s*maximum-scale\s*=\s*[\d.]+/ig, '')
       .replace(/\s*,?\s*user-scalable\s*=\s*(no|0)/ig, '')
       .replace(/^\s*,\s*/, '')
       .trim();
  m.setAttribute('content', v);
})();
</script>
