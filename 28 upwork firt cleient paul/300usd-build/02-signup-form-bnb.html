<!--
  BNB Photos — footer newsletter signup  ·  list: bnb-hosts
  Deploy: WordPress → WPCode Lite (or the Elementor FOOTER template → HTML widget).
  DO NOT open the BNB homepage in Elementor to place this. PHP memory is 128M on this
  host and saving the homepage fails at that limit. Footer template or WPCode only.

  Before it works, replace exactly two things:
    1. FORM_ACTION_URL   → the Brevo form's action, e.g. https://sibforms.com/serve/MUIF...
    2. /thank-you/       → confirm that page exists (see 05-brevo-setup-runbook.md)

  Deliberately native HTML: no JavaScript, no third-party script tag. BNB is at PSI mobile
  94 and a newsletter JS embed is exactly the kind of third party that would cost it.
  Gate G3 in ../GATES-300usd.md fails if any newsletter JS appears on the homepage.
-->

<style>
  .nl-signup {
    /* Change this one value to match the site's accent if needed. */
    --nl-accent: #0f172a;
    --nl-ink: #0f172a;
    --nl-muted: #5b6472;
    --nl-line: #d9dee6;

    font: inherit;              /* inherit the site's own typography, don't fight it */
    color: var(--nl-ink);
    max-width: 30rem;
    margin: 0;
  }
  .nl-signup__title {
    font-size: 1.0625rem;
    font-weight: 700;
    margin: 0 0 .35rem;
    line-height: 1.3;
  }
  .nl-signup__blurb {
    font-size: .875rem;
    color: var(--nl-muted);
    margin: 0 0 .75rem;
    line-height: 1.5;
  }
  .nl-signup__row {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
  }
  .nl-signup__input {
    flex: 1 1 12rem;
    min-width: 0;
    padding: .7rem .8rem;
    font: inherit;
    font-size: .9375rem;
    color: var(--nl-ink);
    background: #fff;
    border: 1px solid var(--nl-line);
    border-radius: .375rem;
  }
  .nl-signup__input:focus-visible {
    outline: 2px solid var(--nl-accent);
    outline-offset: 1px;
  }
  .nl-signup__btn {
    flex: 0 0 auto;
    padding: .7rem 1.15rem;
    font: inherit;
    font-size: .9375rem;
    font-weight: 600;
    color: #fff;
    background: var(--nl-accent);
    border: 1px solid var(--nl-accent);
    border-radius: .375rem;
    cursor: pointer;
  }
  .nl-signup__btn:hover { opacity: .9; }
  .nl-signup__note {
    font-size: .75rem;
    color: var(--nl-muted);
    margin: .55rem 0 0;
    line-height: 1.5;
  }
  /* Honeypot: visually hidden, still reachable by bots that fill every field.
     Brevo validates this field server-side and drops the submission if filled. */
  .nl-signup__trap {
    position: absolute !important;
    left: -9999px !important;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }
</style>

<div class="nl-signup">
  <p class="nl-signup__title">Get more bookings from better photos</p>
  <p class="nl-signup__blurb">
    Occasional tips for Airbnb and vacation-rental hosts on the Suncoast — how to prep a
    property, what guests actually scroll past, and when a refresh is worth it.
  </p>

  <form action="FORM_ACTION_URL" method="POST" novalidate>
    <div class="nl-signup__row">
      <label class="nl-signup__trap" aria-hidden="true">
        Leave this field empty
        <input type="text" name="email_address_check" value="" tabindex="-1" autocomplete="off">
      </label>

      <label class="nl-signup__trap" for="nl-email-bnb">Email address</label>
      <input
        class="nl-signup__input"
        id="nl-email-bnb"
        type="email"
        name="EMAIL"
        required
        autocomplete="email"
        placeholder="Your email address">

      <input type="hidden" name="locale" value="en">
      <input type="hidden" name="html_type" value="simple">

      <button class="nl-signup__btn" type="submit">Send me tips</button>
    </div>

    <p class="nl-signup__note">
      A few emails a year, never more. Unsubscribe any time in one click.
    </p>
  </form>
</div>
