<!--
==========================================================================
  DVPFL — FLOATING CALL + EMAIL BUTTON
  v1.0  |  2026-08-30

  WHY THIS EXISTS
  Chaty was deactivated on 2026-08-29 as part of the speed work. It was
  carrying the site's only tap-to-call — measured on all 17 pages — so
  deactivating it left every page except /contact-us/ with no way to phone
  or email at all. On a wedding videography site, where couples ring you,
  that is a lead hole, not a cosmetic issue.

  It also happens to be Issue #7 from the August audit:
  "No tel: link and no email link on the homepage. Wedding leads call/text.
   The floating CALL US NOW!!! widget is the only tap-to-call."

  This replaces the widget without the plugin. Chaty shipped a render-
  blocking stylesheet plus a footer script; this is inline HTML, CSS and a
  single anchor — no extra request at all, and a real <a href="tel:"> that
  search engines and screen readers understand, which the old widget's
  javascript:void(0) markup did not.

  Numbers are the ones the old widget used and the contact page still
  shows: tel:+19418940980 and paul@dvpfl.com.

  DEPLOY
  Elementor -> Custom Code -> location <body> - End, condition Entire Site.
  Keep it separate from snippet 2596, which is front-page-only and holds
  the homepage poster work.
==========================================================================
-->

<script>
/* ------------------------------------------------------------------
   Audit issue #10, second half: pinch-zoom is disabled sitewide.

   The Aurel theme prints, at offset ~125 of every page:
       <meta name="viewport"
             content="width=device-width, initial-scale=1, maximum-scale=1">

   `maximum-scale=1` stops a visitor pinching to zoom. That fails WCAG
   1.4.4 (Resize Text) and Lighthouse flags it under Accessibility as
   [user-scalable="no"] ... or [maximum-scale] is less than 5. On a site
   whose buyers are often the couple's parents, being unable to zoom is a
   real problem, not a checkbox.

   The theme gives no setting for it and there is no child theme, so we
   rewrite the tag. Browsers re-evaluate the viewport when this attribute
   changes, so doing it here still restores zoom.

   Only `maximum-scale` and `user-scalable` are touched; width and
   initial-scale are left exactly as the theme set them, so layout is
   unaffected.
   ------------------------------------------------------------------ */
(function () {
  if (location.search.indexOf('dvpdebug=off') > -1) return;  /* bisect kill-switch */
  var m = document.querySelector('meta[name="viewport"]');
  if (!m) return;
  var v = m.getAttribute('content') || '';
  if (!/maximum-scale|user-scalable/i.test(v)) return;   /* already fine */
  v = v.replace(/\s*,?\s*maximum-scale\s*=\s*[\d.]+/ig, '')
       .replace(/\s*,?\s*user-scalable\s*=\s*(no|0)/ig, '')
       .replace(/^\s*,\s*/, '')
       .trim();
  m.setAttribute('content', v);
})();
</script>

<script>
/* ------------------------------------------------------------------
   Accessibility fixes for things the theme hard-codes.
   Each one maps to a failing Lighthouse audit measured on this site.
   Runs at </body>, so everything it touches already exists.
   ------------------------------------------------------------------ */
(function () {
  if (location.search.indexOf('dvpdebug=off') > -1) return;  /* bisect kill-switch */

  /* "frame or iframe elements do not have a title" - the Tave contact
     form iframe ships without one. Generic fallback for any other. */
  document.querySelectorAll('iframe:not([title])').forEach(function (f) {
    var src = f.src || f.getAttribute('data-lazy-load') || '';
    f.title = /vsco\.page|tave/i.test(src)
      ? 'Contact form - check your wedding date'
      : 'Embedded content';
  });

  /* "Links do not have a discernible name" - the theme's logo link,
     Facebook icon and the two icon-only toggles are empty <a> tags. */
  var labels = [
    ['a.aurel_image_logo',               'Digital Video Productions - home'],
    ['a[class*="aurel_facebook"]',       'Digital Video Productions on Facebook'],
    ['a.aurel_toogle_fullview',          'Toggle fullscreen view'],
    ['a.aurel_header_mobile_menu_toggler','Open menu']
  ];
  labels.forEach(function (pair) {
    document.querySelectorAll(pair[0]).forEach(function (a) {
      if (!a.getAttribute('aria-label') && !(a.innerText || '').trim()) {
        a.setAttribute('aria-label', pair[1]);
      }
    });
  });

  /* "Document does not have a main landmark" - mark the Elementor page
     content, which every page on this site has exactly one of. */
  if (!document.querySelector('main, [role="main"]')) {
    var el = document.querySelector('.elementor[data-elementor-type="wp-page"], .elementor[data-elementor-type="wp-post"]');
    if (el) el.setAttribute('role', 'main');
  }

  /* "Heading elements are not in a sequentially-descending order".
     The theme skips levels (home runs H5 H5 H5 H1 H3 H3 H5). Walk the
     headings in DOM order; wherever one jumps more than a level DOWN,
     retag it to the deepest allowed level. Computed typography is
     copied onto the new element first, so nothing changes visually. */
  var prev = 0;
  [].slice.call(document.querySelectorAll('h1,h2,h3,h4,h5,h6')).forEach(function (h) {
    var lvl = +h.tagName[1];
    if (prev && lvl > prev + 1) {
      var want = prev + 1;
      var cs = getComputedStyle(h);
      var n = document.createElement('h' + want);
      for (var i = 0; i < h.attributes.length; i++) {
        n.setAttribute(h.attributes[i].name, h.attributes[i].value);
      }
      ['fontSize','fontWeight','fontFamily','lineHeight','letterSpacing',
       'textTransform','margin','color','textAlign'].forEach(function (k) {
        n.style[k] = cs[k];
      });
      while (h.firstChild) n.appendChild(h.firstChild);
      h.parentNode.replaceChild(n, h);
      lvl = want;
    }
    prev = lvl;
  });
})();
</script>
