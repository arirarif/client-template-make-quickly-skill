<!--
  Digital Video Productions FL — footer newsletter signup  ·  list: dvpfl-couples
  Deploy: Elementor → Custom Code, footer position. That is the ONLY safe route on this site —
  the Aurel theme has no child theme, so nothing goes in theme files.
  After saving: WP Rocket → "Clear and preload". Never activate a second cache plugin.

  Replace before it works:
    1. FORM_ACTION_URL  → the Brevo form action, e.g. https://sibforms.com/serve/MUIF...
       (only the one inside the <form> tag)
    2. Confirm /thank-you/ exists — see 03-brevo-setup-runbook.md

  Do NOT restyle or hide the floating call button while working in this footer — it is the
  mobile LCP element on this site, and hiding it wrecks the score.

  Audience note: couples buy once, months ahead, and are comparing. The promise is help
  deciding, not "tips". Tone is warmer than the other two sites.
-->

<style>
  .nl-signup {
    /* DVPFL runs a dark theme — these tokens suit a dark footer. */
    --nl-accent: #c9a227;
    --nl-ink: #f4f4f5;
    --nl-muted: #a1a1aa;
    --nl-line: #3f3f46;
    --nl-field-bg: #18181b;

    font: inherit;
    color: var(--nl-ink);
    max-width: 30rem;
    margin: 0;
  }
  .nl-signup__title { font-size: 1.0625rem; font-weight: 700; margin: 0 0 .35rem; line-height: 1.3; }
  .nl-signup__blurb { font-size: .875rem; color: var(--nl-muted); margin: 0 0 .75rem; line-height: 1.5; }
  .nl-signup__row { display: flex; flex-wrap: wrap; gap: .5rem; }
  .nl-signup__input {
    flex: 1 1 12rem; min-width: 0; padding: .7rem .8rem;
    font: inherit; font-size: .9375rem; color: var(--nl-ink);
    background: var(--nl-field-bg); border: 1px solid var(--nl-line); border-radius: .375rem;
  }
  .nl-signup__input::placeholder { color: var(--nl-muted); }
  .nl-signup__input:focus-visible { outline: 2px solid var(--nl-accent); outline-offset: 1px; }
  .nl-signup__btn {
    flex: 0 0 auto; padding: .7rem 1.15rem;
    font: inherit; font-size: .9375rem; font-weight: 600;
    color: #1c1917; background: var(--nl-accent);
    border: 1px solid var(--nl-accent); border-radius: .375rem; cursor: pointer;
  }
  .nl-signup__btn:hover { opacity: .9; }
  .nl-signup__note { font-size: .75rem; color: var(--nl-muted); margin: .55rem 0 0; line-height: 1.5; }
  /* Honeypot: off-screen, still filled by bots. Brevo validates it server-side. */
  .nl-signup__trap { position: absolute !important; left: -9999px !important; width: 1px; height: 1px; overflow: hidden; }
</style>

<div class="nl-signup">
  <p class="nl-signup__title">Planning a wedding on the Suncoast?</p>
  <p class="nl-signup__blurb">
    A few emails while you plan — real weddings we have filmed, questions worth asking any
    videographer, and how far ahead the good dates go.
  </p>

  <form action="FORM_ACTION_URL" method="POST" novalidate>
    <div class="nl-signup__row">
      <label class="nl-signup__trap" aria-hidden="true">
        Leave this field empty
        <input type="text" name="email_address_check" value="" tabindex="-1" autocomplete="off">
      </label>

      <label class="nl-signup__trap" for="nl-email-dvpfl">Email address</label>
      <input
        class="nl-signup__input"
        id="nl-email-dvpfl"
        type="email"
        name="EMAIL"
        required
        autocomplete="email"
        placeholder="Your email address">

      <input type="hidden" name="locale" value="en">
      <input type="hidden" name="html_type" value="simple">

      <button class="nl-signup__btn" type="submit">Send them over</button>
    </div>

    <p class="nl-signup__note">
      A few emails while you plan, then we stop. Unsubscribe any time in one click.
    </p>
  </form>
</div>
