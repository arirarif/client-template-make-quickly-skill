<!-- STATS -->
<section class="stats section-dark" id="stats">
  <div class="container">
    <div class="stats-grid">

      <div class="stat-card glass-card reveal">
        <div class="stat-icon">🏢</div>
        <div class="stat-num" data-target="2200" data-suffix="+">0</div>
        <div class="stat-label">Businesses Formed</div>
      </div>

      <div class="stat-card glass-card reveal reveal-delay-1">
        <div class="stat-icon">🗺️</div>
        <div class="stat-num" data-target="50" data-suffix=" States">0</div>
        <div class="stat-label">Available Nationwide</div>
      </div>

      <div class="stat-card glass-card reveal reveal-delay-2">
        <div class="stat-icon">⭐</div>
        <div class="stat-num" data-target="4.8" data-suffix="★" data-decimal="1">0</div>
        <div class="stat-label">Average Rating</div>
      </div>

      <div class="stat-card glass-card reveal reveal-delay-3">
        <div class="stat-icon">📅</div>
        <div class="stat-num" data-target="20" data-suffix="+ Yrs">0</div>
        <div class="stat-label">Years of Experience</div>
      </div>

    </div>
  </div>
</section>
