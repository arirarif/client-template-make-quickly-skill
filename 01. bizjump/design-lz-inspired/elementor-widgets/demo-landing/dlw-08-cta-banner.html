<style>
.dlw08-banner {
  background: linear-gradient(135deg, #EA580C 0%, #F97316 60%, #FB923C 100%);
  padding: 72px 0;
  text-align: center;
  position: relative;
  overflow: hidden;
  font-family: 'Inter', sans-serif;
}
.dlw08-banner::before {
  content: ''; position: absolute;
  top: -40%; left: -10%;
  width: 500px; height: 500px;
  background: rgba(255,255,255,0.06);
  border-radius: 50%;
}
.dlw08-banner::after {
  content: ''; position: absolute;
  bottom: -30%; right: -5%;
  width: 400px; height: 400px;
  background: rgba(255,255,255,0.05);
  border-radius: 50%;
}
.dlw08-inner {
  position: relative; z-index: 1;
  max-width: 1160px; margin: 0 auto; padding: 0 24px;
}
.dlw08-h2 {
  font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
  font-size: clamp(26px, 3.5vw, 42px);
  font-weight: 800; color: #fff;
  line-height: 1.2; letter-spacing: -.02em;
  margin: 0 0 14px;
}
.dlw08-p {
  font-size: 17px;
  color: rgba(255,255,255,0.82);
  max-width: 480px; margin: 0 auto 32px;
  line-height: 1.65;
}
.dlw08-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: #fff;
  color: #EA580C;
  font-size: 16px; font-weight: 700;
  padding: 15px 38px;
  border-radius: 10px;
  border: none; cursor: pointer;
  box-shadow: 0 4px 20px rgba(0,0,0,0.20);
  transition: all .2s;
  text-decoration: none;
  font-family: 'Inter', sans-serif;
}
.dlw08-btn:hover {
  background: #FFF7ED;
  box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  transform: translateY(-2px);
  color: #EA580C;
}
.dlw08-btn svg { transition: transform .2s; }
.dlw08-btn:hover svg { transform: translateX(3px); }
.dlw08-note {
  margin-top: 16px;
  font-size: 13px;
  color: rgba(255,255,255,0.65);
}

@media (max-width: 600px) {
  .dlw08-banner { padding: 56px 0; }
  .dlw08-p { font-size: 15px; margin-bottom: 24px; }
  .dlw08-btn { padding: 13px 28px; font-size: 15px; }
  .dlw08-note { font-size: 12px; }
}
</style>

    </a>
    <p class="dlw08-note">No hidden fees &nbsp;·&nbsp; 100% satisfaction guarantee &nbsp;·&nbsp; Trusted by 4M+ entrepreneurs</p>
